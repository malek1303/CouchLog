<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <linearGradient id="brand-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background Rounded Rect -->
  <rect x="2" y="2" width="28" height="28" rx="8" fill="#0b0d19" stroke="url(#brand-grad)" stroke-width="1.5" />
  <!-- Sleek Glowing TV/Screen icon -->
  <rect x="6" y="8" width="20" height="13" rx="2" fill="none" stroke="url(#brand-grad)" stroke-width="2" filter="url(#glow)" />
  <!-- TV Antennas and stand -->
  <path d="M12 21 L10 24 M20 21 L22 24" stroke="url(#brand-grad)" stroke-width="1.5" stroke-linecap="round" />
  <path d="M13 24 L19 24" stroke="url(#brand-grad)" stroke-width="1.5" stroke-linecap="round" />
  <!-- TV Play button symbol inside -->
  <polygon points="14,12 19,14.5 14,17" fill="url(#brand-grad)" />
</svg>
